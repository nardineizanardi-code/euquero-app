<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="eqGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </radialGradient>
    <linearGradient id="eqOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8533"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>

  <!-- Fundo Preto Redondo com Borda Discreta -->
  <circle cx="256" cy="256" r="248" fill="url(#eqGlow)" stroke="#334155" stroke-width="8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#FF6B00" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Letra 'E' estilizada em Branco -->
  <text x="180" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="200" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-6">E</text>

  <!-- Letra 'Q' estilizada em Laranja Vibrante #FF6B00 -->
  <text x="330" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="200" font-weight="900" fill="url(#eqOrange)" text-anchor="middle" letter-spacing="-6">Q</text>

  <!-- Ponto Laranja de Destaque -->
  <circle cx="430" cy="180" r="16" fill="#FF6B00"/>
</svg>
